 sections.forEach(section=>section.items.forEach((item,index)=>{
  const combined=(w.tabs[section.tab]+' '+item.join(' ')).toLocaleLowerCase();
  if(combined.includes(q))matches.push({tab:section.tab,title:item[0],description:item[1],index});
 }));
 results.hidden=false;
 results.innerHTML=matches.length?matches.map((m,i)=>'<button type="button" class="search-hit" data-hit="'+i+'"><strong>'+esc(w.tabs[m.tab]+' · '+m.title)+'</strong><small>'+esc(m.description)+'</small></button>').join(''):'<div class="search-empty">'+esc(w.noresults)+'</div>';
 results.querySelectorAll('[data-hit]').forEach(b=>b.addEventListener('click',()=>{
  const m=matches[Number(b.dataset.hit)];
  tab=m.tab;$('search').value='';hideSearch();render();
  if([3,4,5].includes(tab)){
   const details=$('content').querySelectorAll('details');
   if(details[m.index]){details[m.index].open=true;details[m.index].scrollIntoView({behavior:'smooth',block:'center'});}
  }else if(tab===1){
   const checks=$('content').querySelectorAll('.check');
   if(checks[m.index])checks[m.index].scrollIntoView({behavior:'smooth',block:'center'});
  }else $('content').scrollIntoView({behavior:'smooth',block:'start'});
 }));
}
$('lang').onclick=()=>{language=language==='mn'?'en':'mn';localStorage.setItem('num-lang',language);render();filter()};
$('search').addEventListener('input',filter);
$('search').addEventListener('focus',filter);
$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){hideSearch();$('search').blur()}if(e.key==='Enter'){const first=$('search-results').querySelector('[data-hit]');if(first)first.click();}});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))hideSearch()});
render();
</script></body></html>
